name: Web Monitor

# Do not enable ACTIONS_RUNNER_DEBUG or ACTIONS_STEP_DEBUG in public repos.
# Debug logs may include additional execution details.

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Trigger source"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: web-monitor
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Log trigger source
        env:
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
        run: echo "trigger_source=${TRIGGER_SOURCE:-${GITHUB_EVENT_NAME}}"

      - name: Run monitor
        env:
          MONITOR_TARGETS: ${{ secrets.MONITOR_TARGETS }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          PAYLOAD_ENCRYPTION_KEY: ${{ secrets.PAYLOAD_ENCRYPTION_KEY }}
          STATE_GIST_ID: ${{ secrets.STATE_GIST_ID }}
          STATE_GIST_TOKEN: ${{ secrets.STATE_GIST_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ secrets.DISPATCH_REPO }}
        run: python watch.py
